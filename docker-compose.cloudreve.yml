services:
  cloudreve:
    image: cloudreve/cloudreve:4.18.0@sha256:f7a464100bf6325e9ba58cb2b0ee60f9a24c58fc2eb90647720bc4b8f3cddd9a
    env_file:
      - .env
    volumes:
      - backend-data:/cloudreve/data
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:5212 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: 'on-failure:3'
    deploy:
      resources:
        limits:
          cpus: '1'

  postgres:
    image: postgres:17
    env_file:
      - .env
    volumes:
      - database-postgres:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: 'on-failure:3'

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: 'on-failure:3'

volumes:
  backend-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/cloudreve-rcp/data
  database-postgres:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/cloudreve-rcp/postgres
  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /root/cloudreve-rcp/redis

networks:
  internal:
    driver: bridge
